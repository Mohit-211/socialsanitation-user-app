		9E176E4AE665FD9BF8FBE751 /* [RNFB] Embed Firebase SPM Frameworks */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			buildActionMask = 2147483647;
			files = (
			);
			inputFileListPaths = (
